version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pharmerp_nginx
    restart: unless-stopped
    ports:
      # The shared VPS host nginx is the only public listener on 80/443.
      # This internal proxy is reachable only from that host on a unique port.
      - "127.0.0.1:${PHARMERP_NGINX_PORT:-8093}:80"
    volumes:
      - ./nginx.vps.conf:/etc/nginx/nginx.conf:ro
      # Hashed Next.js assets retained across deploys. Read-only here: the
      # frontend container is the only writer. nginx serves these directly and
      # falls back to proxying the frontend when a file is absent.
      - next_static_archive:/var/www/next-static-root:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - pharmerp_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # Test the upstream application route, not merely `nginx -t`.
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pharmerp_backend
    # Explicit tags let scripts/deploy.sh retain one known-good image and
    # restore it automatically if a newly built container never becomes ready.
    image: pharmerp-backend:current
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      # Apply pending Drizzle migrations before the API starts serving. Also
      # set in .env.production and baked into the image; repeated here so the
      # stack still migrates if an operator's .env.production predates it.
      RUN_MIGRATIONS_ON_BOOT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pharmerp_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # `/health` is registered directly on Fastify (outside the /api/v1
      # prefix). Node 20 provides fetch, unlike wget which is not guaranteed
      # to be present in the slim runtime image.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pharmerp_frontend
    image: pharmerp-frontend:current
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Do not inherit the backend's PORT=4000 from .env.production. Next's
      # standalone server otherwise binds to 4000 while nginx proxies to 3000,
      # resulting in a permanent 502 despite a "Ready" frontend process.
      PORT: "3000"
      NEXT_PUBLIC_API_URL: /api/v1
      # Days an asset is kept after the last deploy that shipped it. Sets how
      # long a client running an old build can still resolve its chunks.
      NEXT_STATIC_RETENTION_DAYS: "30"
    volumes:
      # Written by the container entrypoint on every boot; see
      # frontend/docker-entrypoint.sh.
      - next_static_archive:/var/www/next-static-root
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pharmerp_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # This image already includes Node 20. Use fetch instead of BusyBox wget:
      # its GNU-only flags caused a false "unhealthy" result on Alpine.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: pharmerp_postgres_prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-pharmerp}
      POSTGRES_USER: ${DB_USER:-pharmerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - pharmerp_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pharmerp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: pharmerp_postgres_backup
    restart: unless-stopped
    user: root
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-pharmerp}
      POSTGRES_USER: ${DB_USER:-pharmerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "0 2 * * *"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharmerp_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: pharmerp_redis_prod
    restart: unless-stopped
    env_file: .env.production
    # Resolve the password inside the container from env_file. Using a host
    # side ${REDIS_PASSWORD} here made Redis start with a different (or blank)
    # password whenever Compose was invoked without --env-file .env.production.
    command: ["/bin/sh", "-ec", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_prod_data:/data
    networks:
      - pharmerp_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # Use the same container environment as the Redis server. `$$` is
      # required so Compose does not try to substitute it on the VPS host.
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pharmerp_clickhouse_prod
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: pharmerp_analytics
      CLICKHOUSE_USER: pharmerp
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_prod_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - pharmerp_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: pharmerp_minio_prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_prod_data:/data
    networks:
      - pharmerp_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  pharmerp_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  clickhouse_prod_data:
  minio_prod_data:
  # Accumulates hashed /_next/static output across deploys. Safe to delete: it
  # rebuilds itself on the next container start, costing only the ability of
  # already-open older clients to resolve their chunks until they reload.
  next_static_archive:
