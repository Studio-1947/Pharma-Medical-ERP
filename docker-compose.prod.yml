version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pharmerp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pharmerp_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pharmerp_backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pharmerp_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pharmerp_frontend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - backend
    networks:
      - pharmerp_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: pharmerp_postgres_prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-pharmerp}
      POSTGRES_USER: ${DB_USER:-pharmerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - pharmerp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pharmerp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: pharmerp_postgres_backup
    restart: unless-stopped
    user: root
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-pharmerp}
      POSTGRES_USER: ${DB_USER:-pharmerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "0 2 * * *"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharmerp_net

  redis:
    image: redis:7-alpine
    container_name: pharmerp_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - pharmerp_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pharmerp_clickhouse_prod
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: pharmerp_analytics
      CLICKHOUSE_USER: pharmerp
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_prod_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - pharmerp_net

  minio:
    image: minio/minio
    container_name: pharmerp_minio_prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_prod_data:/data
    networks:
      - pharmerp_net

networks:
  pharmerp_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  clickhouse_prod_data:
  minio_prod_data:

