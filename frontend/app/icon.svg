<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="url(#shine)"/>

  <!-- Pharmacy cross — vertical -->
  <rect x="13.5" y="6" width="5" height="20" rx="2.5" fill="white" fill-opacity="0.96"/>
  <!-- Pharmacy cross — horizontal -->
  <rect x="6" y="13.5" width="20" height="5" rx="2.5" fill="white" fill-opacity="0.96"/>
</svg>
