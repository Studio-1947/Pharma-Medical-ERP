<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <!-- Subtle top-left gloss -->
  <rect width="48" height="48" rx="11" fill="url(#shine)"/>

  <!-- Pharmacy cross — vertical bar -->
  <rect x="20" y="9" width="8" height="30" rx="4" fill="white" fill-opacity="0.96"/>
  <!-- Pharmacy cross — horizontal bar -->
  <rect x="9" y="20" width="30" height="8" rx="4" fill="white" fill-opacity="0.96"/>

  <!-- Small pill accent — upper-right corner, rotated 45° -->
  <rect x="33" y="6" width="11" height="5" rx="2.5"
        fill="white" fill-opacity="0.30"
        transform="rotate(-45 38.5 8.5)"/>
</svg>
