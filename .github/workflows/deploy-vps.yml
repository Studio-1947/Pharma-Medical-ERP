name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two Docker deployments against the same VPS at once. Queue newer
# pushes instead of cancelling an in-flight SSH session, which could otherwise
# leave containers halfway through a recreate.
concurrency:
  group: pharmerp-production-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: |
          pnpm --filter @pharmerp/types build
          pnpm --filter @pharmerp/utils build || true

      - name: Typecheck Backend
        run: pnpm --filter backend typecheck

      - name: Typecheck Frontend
        run: pnpm --filter frontend typecheck

      - name: Run Backend Tests
        run: pnpm --filter backend test

      - name: Run Frontend Tests
        run: pnpm --filter frontend test

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Trigger Automatic Deployment on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/pharmerp
            ./scripts/deploy.sh
