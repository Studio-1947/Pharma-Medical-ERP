name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two Docker deployments against the same VPS at once. Queue newer
# pushes instead of cancelling an in-flight SSH session, which could otherwise
# leave containers halfway through a recreate.
concurrency:
  group: pharmerp-production-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  # OCI repository names must be lowercase; the GitHub organisation is
  # displayed as Studio-1947 but GHCR addresses it with this normalized name.
  REGISTRY_NAMESPACE: studio-1947

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect affected applications
        id: changes
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^ HEAD)"
          backend=false
          frontend=false
          if grep -Eq '^(backend/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|docker-compose\.prod\.yml$|\.dockerignore$)' <<<"$changed_files"; then backend=true; fi
          if grep -Eq '^(frontend/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|docker-compose\.prod\.yml$|\.dockerignore$)' <<<"$changed_files"; then frontend=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: |
          pnpm --filter @pharmerp/types build
          pnpm --filter @pharmerp/utils build || true

      - name: Typecheck Backend
        if: steps.changes.outputs.backend == 'true'
        run: pnpm --filter backend typecheck

      - name: Typecheck Frontend
        if: steps.changes.outputs.frontend == 'true'
        run: pnpm --filter frontend typecheck

      - name: Run Backend Tests
        if: steps.changes.outputs.backend == 'true'
        run: pnpm --filter backend test

      - name: Run Frontend Tests
        if: steps.changes.outputs.frontend == 'true'
        run: pnpm --filter frontend test

  build-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: needs.lint-and-test.outputs.backend == 'true' || needs.lint-and-test.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: frontend
            dockerfile: frontend/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=/api/v1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        if: (matrix.service == 'backend' && needs.lint-and-test.outputs.backend == 'true') || (matrix.service == 'frontend' && needs.lint-and-test.outputs.frontend == 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.REGISTRY_NAMESPACE }}/pharmerp-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.REGISTRY_NAMESPACE }}/pharmerp-${{ matrix.service }}:latest-vps
          cache-from: type=gha,scope=vps-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=vps-${{ matrix.service }}

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
      PREBUILT_BACKEND_IMAGE: ghcr.io/studio-1947/pharmerp-backend:${{ github.sha }}
      PREBUILT_FRONTEND_IMAGE: ghcr.io/studio-1947/pharmerp-frontend:${{ github.sha }}

    steps:
      - name: Trigger Automatic Deployment on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN,PREBUILT_BACKEND_IMAGE,PREBUILT_FRONTEND_IMAGE
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            cd /opt/pharmerp
            ./scripts/deploy.sh
