worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1000;

  upstream backend {
    server backend:4000;
    keepalive 32;
  }

  upstream frontend {
    server frontend:3000;
    keepalive 32;
  }

  # ─── HTTP Server — ACME challenge + redirect all HTTP → HTTPS ────────────────
  server {
    listen 80;
    server_name _;

    # Let's Encrypt Certbot ACME challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS Server — main production entrypoint ────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    # TLS certificates — issued by Certbot / Let's Encrypt
    # Run: certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern TLS settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check for load balancers / Cloud Run probes
    location /health {
      proxy_pass http://backend/api/v1/health;
      proxy_set_header Host $host;
      access_log off;
    }

    # Auth Login — strict rate limiting
    location /api/v1/auth/login {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 60s;
    }

    # ─── Next.js hashed assets — retained across deploys ────────────────────────
    # Chunk filenames are content-hashed, so builds can coexist. The frontend
    # container merges each build's output into this volume and prunes only
    # assets no deploy has shipped for NEXT_STATIC_RETENTION_DAYS, which lets a
    # browser still running an older build resolve its chunks instead of taking
    # a 404 and dying with ChunkLoadError.
    #
    # try_files falls back to the frontend container on any miss, so an empty,
    # stale or unmounted archive behaves exactly as it did before it existed.
    location /_next/static/ {
      root /var/www/next-static-root;
      try_files $uri @frontend_upstream;

      access_log off;

      # Hashed filenames never change content, so this is safe to pin.
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      # An add_header at this level cancels inheritance of the server-level
      # add_header directives, so the security headers that must survive on
      # every response are repeated here rather than silently dropped.
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Frontend App
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Fallback target for assets absent from the retention volume.
    location @frontend_upstream {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
